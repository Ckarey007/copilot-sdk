models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Use resume_external_tool with value 'beta', then reply with the result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: resume_external_tool
              arguments: '{"value":"beta"}'
      - role: tool
        tool_call_id: toolcall_0
        content: Tool execution was interrupted before a result was recorded. Its effects may be absent, partial, or already
          complete, and other tools may have completed successfully. Check the current state before retrying; do not
          assume success or replay this operation blindly.
      - role: user
        content: "Reply with exactly: COLD_RESUMED_FOLLOWUP"
      - role: assistant
        content: COLD_RESUMED_FOLLOWUP
